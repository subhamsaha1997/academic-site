<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos | Subham</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js" defer></script>
</head>
<body>
  <button id="theme-toggle" type="button"
          aria-label="Switch to light theme">☀</button>

  <div class="photos-page">
    <header class="photos-header">
      <a href="index.html" class="back-link">← Back home</a>
      <h1>Photos</h1>
      <p>A few moments from places I've been and things I've seen.</p>
    </header>

    <main class="photo-grid">
      <figure>
        <a href="images/photos/photo-01.jpg" target="_blank"
           rel="noopener noreferrer">
          <img src="images/photos/photo-01.jpg" alt="Description of photo 1">
        </a>
        <figcaption>Location · Year</figcaption>
      </figure>

      <figure>
        <a href="images/photos/photo-02.jpg" target="_blank"
           rel="noopener noreferrer">
          <img src="images/photos/photo-02.jpg" alt="Description of photo 2">
        </a>
        <figcaption>Location · Year</figcaption>
      </figure>

      <figure>
        <a href="images/photos/photo-03.jpg" target="_blank"
           rel="noopener noreferrer">
          <img src="images/photos/photo-03.jpg" alt="Description of photo 3">
        </a>
        <figcaption>Location · Year</figcaption>
      </figure>
    </main>
  </div>
</body>
</html>
